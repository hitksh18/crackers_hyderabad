# Crackers Hyderabad — production Nginx site config (three applications,
# three hostnames, one API).
#
#   crackershyderabad.com   -> /var/www/crackershyderabad        (customer storefront)
#   admin.crackershyderabad.com  -> /var/www/crackershyderabad-admin   (staff console)
#   billing.crackershyderabad.com -> /var/www/crackershyderabad-billing (counter register)
#
# Install on the KVM as /etc/nginx/sites-available/crackershyderabad, then:
#   sudo ln -s /etc/nginx/sites-available/crackershyderabad /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with the real domain (e.g. crackershyderabad.com) —
# deploy/kvm/setup-and-deploy.sh does this via sed.
# Certbot adds the :443 blocks itself:
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN \
#        -d admin.YOUR_DOMAIN -d billing.YOUR_DOMAIN

upstream crackers_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Customer storefront — crackershyderabad.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Vite production build output (copied by deploy/kvm scripts).
    root /var/www/crackershyderabad;
    index index.html;

    # Single-domain era paths, redirected to their new subdomain homes so
    # old bookmarks and search results keep working. These were frontend
    # routes of the old monolith, never API paths (the API lives at /api/).
    location ^~ /admin {
        rewrite ^/admin/?(.*)$ https://admin.YOUR_DOMAIN/$1$is_args$args permanent;
    }
    location ^~ /billing {
        rewrite ^/billing/?(.*)$ https://billing.YOUR_DOMAIN/$1$is_args$args permanent;
    }
    location ^~ /price-list {
        rewrite ^/price-list/?(.*)$ https://admin.YOUR_DOMAIN/price-list$is_args$args permanent;
    }

    # Uploaded product/banner images live outside the web root; Nginx serves
    # them directly so Node never streams bytes.
    location /uploads/ {
        alias /var/www/crackershyderabad-media/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        # Never execute anything that lands in the upload dir.
        add_header X-Content-Type-Options "nosniff" always;
        types { }
        default_type image/jpeg;
    }

    # Express API (PM2 crackers-api on :3001). Same-origin /api/* keeps the
    # frontend on VITE_BACKEND_API_URL=/api with no CORS in play.
    location /api/ {
        proxy_pass http://crackers_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Vite hashed assets — safe to cache for a year (filename changes per build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Static images/icons shipped with the build.
    location ~* \.(png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # Never cache the SPA shell — otherwise clients keep a stale index.html
    # pointing at deleted hashed bundles after each deploy.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback: every non-file route (/, /products, /product/:slug, /cart,
    # /checkout, /my-orders, /track-order, ...) serves index.html so React
    # Router + browser refresh keep working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Defense-in-depth headers for the static site (API sets its own).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ---------------------------------------------------------------------------
# Staff console — admin.crackershyderabad.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.YOUR_DOMAIN;

    root /var/www/crackershyderabad-admin;
    index index.html;

    # Same-origin API + media on every subdomain: each frontend builds with
    # VITE_BACKEND_API_URL=/api, and image URLs that are not absolute point
    # at /uploads on their own host.
    location /uploads/ {
        alias /var/www/crackershyderabad-media/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        types { }
        default_type image/jpeg;
    }

    location /api/ {
        proxy_pass http://crackers_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback: root-level staff routes (/dashboard, /orders, /products,
    # /users, /price-list, /canvas, /login, ...) serve the admin shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ---------------------------------------------------------------------------
# Counter register — billing.crackershyderabad.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name billing.YOUR_DOMAIN;

    root /var/www/crackershyderabad-billing;
    index index.html;

    location /uploads/ {
        alias /var/www/crackershyderabad-media/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        types { }
        default_type image/jpeg;
    }

    location /api/ {
        proxy_pass http://crackers_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback: root-level register routes (/, /login, ...) serve the
    # billing shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
