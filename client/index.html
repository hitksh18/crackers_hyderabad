    <!-- Dark theme only: pinned before first paint so there is no flash of
         any other palette. Legacy stored preferences are ignored and cleared
         by the theme module on boot. -->
    <meta name="theme-color" content="#14100E" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />

    <script>
      (function () {
        try {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          localStorage.removeItem('theme');
          localStorage.removeItem('themeMode');
          localStorage.removeItem('darkMode');
          localStorage.removeItem('colorMode');
        } catch (e) {
          /* Storage blocked — dark classes are already applied above. */
        }
      })();
    </script>
