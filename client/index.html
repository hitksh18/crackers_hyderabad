<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Crackers Hyderabad — Premium Fireworks &amp; Wholesale Crackers</title>
    <meta name="description" content="Premium fireworks and wholesale crackers in Hyderabad. Gift boxes, sparklers, rockets, flower pots and festival collections at wholesale pricing, with order tracking and doorstep delivery." />
    <meta name="keywords" content="crackers hyderabad, wholesale crackers, fireworks hyderabad, diwali crackers, sparklers, gift boxes, bulk crackers, festival fireworks" />
    <meta name="author" content="Crackers Hyderabad" />
    <!-- Dark theme only: pinned before first paint so there is no flash of
         any other palette. Legacy stored preferences are ignored and cleared
         by the theme module on boot. -->
    <meta name="theme-color" content="#14100E" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />

    <!-- Critical first-paint shell: the hero is a dark cinematic scene, so the
         page behind the JS bundle is already that darkness. This paints before
         React, Firebase, fonts or product data arrive, and reserves the hero
         height so the first contentful paint does not shift layout. -->
    <style>
      html, body { margin: 0; padding: 0; background: #070505; }
      #root { min-height: 100svh; background: #070505; }
      .hero-stage { min-height: 540px; background: #070505; }
    </style>

    <script>
      (function () {
        try {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          localStorage.removeItem('theme');
          localStorage.removeItem('themeMode');
          localStorage.removeItem('darkMode');
          localStorage.removeItem('colorMode');
        } catch (e) {
          /* Storage blocked — dark classes are already applied above. */
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crackers Hyderabad" />
    <meta property="og:title" content="Crackers Hyderabad — Premium Fireworks &amp; Wholesale Crackers" />
    <meta property="og:description" content="Premium fireworks and wholesale crackers in Hyderabad. Festival collections, bulk pricing and doorstep delivery." />
    <meta property="og:image" content="https://crackershyderabad.com/images/website/crackerhyderabadlogo.png" />
    <meta property="og:url" content="https://crackershyderabad.com/" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crackers Hyderabad — Premium Fireworks &amp; Wholesale Crackers" />
    <meta name="twitter:description" content="Premium fireworks and wholesale crackers in Hyderabad. Festival collections, bulk pricing and doorstep delivery." />
    <meta name="twitter:image" content="https://crackershyderabad.com/images/website/crackerhyderabadlogo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Above-the-fold hints: the navbar logo is the only image in the first
         viewport (the hero is canvas + gradients), and Firestore serves the
         progressive product/config hydration after the hero paints. -->
    <link rel="preload" href="/images/website/nav-logo.png" as="image" fetchpriority="high" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <!-- Fonts load async (same families, same display=swap): fallback type
         renders immediately, webfonts swap in without blocking first paint. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Crackers Hyderabad",
        "description": "Premium fireworks and wholesale crackers retailer serving Hyderabad.",
        "image": "https://crackershyderabad.com/images/website/crackerhyderabadlogo.png",
        "url": "https://crackershyderabad.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hyderabad",
          "addressRegion": "Telangana",
          "addressCountry": "IN"
        },
        "areaServed": "Hyderabad, Telangana, India"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Crackers Hyderabad",
        "url": "https://crackershyderabad.com",
        "inLanguage": "en-IN",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://crackershyderabad.com/products?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7TK5B2S0WS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-7TK5B2S0WS');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
