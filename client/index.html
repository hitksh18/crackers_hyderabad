    <!-- Kept media-free so the browser chrome never follows the OS into a
         light scheme that contradicts the dark-only storefront. -->
    <meta name="theme-color" content="#14100E" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />

    <!-- Critical first-paint shell: paints before React, Firebase, fonts or
         product data arrive, and reserves the hero height so the first
         contentful paint does not shift layout. The storefront is dark-only,
         so the base is the dark surface — the page never flashes light. -->
    <style>
      html, body { margin: 0; padding: 0; background: #14100E; }
      #root { min-height: 100svh; }
      .hero-stage { min-height: 540px; background: #070505; }
    </style>

    <!-- Dark-only guarantee, resolved before first paint. The `dark` class is
         always applied synchronously here (and re-applied by ThemeContext):
         the OS appearance and any stale stored light choice are ignored, so
         there is no light-theme flash — not even for one frame.
         Must stay in step with src/contexts/ThemeContext.jsx. -->
    <script>
      (function () {
        try {
          localStorage.removeItem('theme');
        } catch (e) {
          /* Storage blocked — the dark default still applies. */
        }
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#14100E');
      })();
    </script>
