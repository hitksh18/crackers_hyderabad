name: Deploy Crackers Hyderabad

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: crackers-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to KVM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to KVM
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.KVM_SSH_PRIVATE_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.KVM_SSH_KNOWN_HOSTS }}
          KVM_HOST: ${{ secrets.KVM_HOST }}
          KVM_USER: ${{ secrets.KVM_USER }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          KEY_B64="$(printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '[:space:]')"

          printf '%s' "$KEY_B64" | base64 --decode > ~/.ssh/kvm_deploy_key
          chmod 600 ~/.ssh/kvm_deploy_key

          ssh-keygen -y -f ~/.ssh/kvm_deploy_key > /dev/null

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

                    echo "Testing TCP 22..."
          timeout 15 bash -c "</dev/tcp/$KVM_HOST/22" && echo "PORT 22: OPEN" || echo "PORT 22: BLOCKED"

          echo "Testing TCP 443..."
          timeout 15 bash -c "</dev/tcp/$KVM_HOST/443" && echo "PORT 443: OPEN" || echo "PORT 443: BLOCKED"
