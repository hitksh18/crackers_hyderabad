name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      # Optional override: repository secrets win when they are set, but an
      # *unset* secret must never blank out the committed client/.env,
      # admin/.env and billing/.env values (public web config that ships in
      # the browser bundle by design). Writing only non-empty values to the
      # git-ignored .env.production.local achieves exactly that, because
      # Vite loads it with the highest precedence in production mode.
      - name: Apply Firebase secrets (optional override)
        env:
          FB_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FB_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FB_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          FB_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          FB_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          for app in client admin billing; do
            touch "$app/.env.production.local"
            [ -n "$FB_API_KEY" ] && echo "VITE_FIREBASE_API_KEY=$FB_API_KEY" >> "$app/.env.production.local"
            [ -n "$FB_AUTH_DOMAIN" ] && echo "VITE_FIREBASE_AUTH_DOMAIN=$FB_AUTH_DOMAIN" >> "$app/.env.production.local"
            [ -n "$FB_PROJECT_ID" ] && echo "VITE_FIREBASE_PROJECT_ID=$FB_PROJECT_ID" >> "$app/.env.production.local"
            [ -n "$FB_STORAGE_BUCKET" ] && echo "VITE_FIREBASE_STORAGE_BUCKET=$FB_STORAGE_BUCKET" >> "$app/.env.production.local"
            [ -n "$FB_SENDER_ID" ] && echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$FB_SENDER_ID" >> "$app/.env.production.local"
            [ -n "$FB_APP_ID" ] && echo "VITE_FIREBASE_APP_ID=$FB_APP_ID" >> "$app/.env.production.local"
            echo "VITE_BACKEND_API_URL=/api" >> "$app/.env.production.local"
          done

      - name: Build frontends (customer + admin + billing)
        run: |
          npm ci --prefix client --no-audit --no-fund
          npm ci --prefix admin --no-audit --no-fund
          npm ci --prefix billing --no-audit --no-fund
          npm run build --prefix client
          npm run build --prefix admin
          npm run build --prefix billing

      - name: Package
        run: |
          mkdir -p package/dist package/dist-admin package/dist-billing
          cp -a client/dist/. package/dist/
          cp -a admin/dist/. package/dist-admin/
          cp -a billing/dist/. package/dist-billing/
          cp -a api package/api
          cp -a scripts package/scripts
          cp -a deploy.sh package/deploy.sh

      - name: Upload and deploy over HTTPS
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tar -czf /tmp/deploy-latest.tar.gz -C package .
          curl -fsS -X POST \
            -H "x-deploy-token: ${TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary @/tmp/deploy-latest.tar.gz \
            "https://${HOST}/api/deploy"
